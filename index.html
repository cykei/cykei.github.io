<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelly Popping</title>
    <style>
        :root {
            --primary-color: #4F46E5;
            --text-color: #1F2937;
            --bg-color: #F9FAFB;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 500px;
            width: 90%;
            padding: 40px 20px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 { font-size: 1.8rem; color: #111827; margin-bottom: 12px; }
        p { color: #4B5563; font-size: 1rem; margin-bottom: 24px; line-height: 1.5; }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-secondary {
            background-color: #E5E7EB;
            color: #374151;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        <h1>젤리팝핑</h1>
        <p>공식 웹사이트 및 고객 지원 페이지입니다.<br>아래 버튼을 통해 필요한 페이지로 이동하실 수 있습니다.</p>
        
        <div class="btn-group">
            <a href="https://sites.google.com/view/jellypopping" class="btn btn-primary" target="_blank">개인정보처리방침</a>
            <a href="mailto:kelle0422@gmail.com" class="btn btn-secondary">고객 지원 이메일 문의하기</a>
        </div>
    </div>

</body>
</html>
